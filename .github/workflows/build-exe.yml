name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Siapkan project (otomatis ekstrak zip kalau perlu)
        id: find
        shell: bash
        run: |
          find_pkg() { find . -name package.json -not -path "*/node_modules/*" -not -path "./.git/*" | head -1; }
          P=$(find_pkg)
          if [ -z "$P" ]; then
            echo "package.json belum ada, mencari file .zip di repo..."
            Z=$(find . -iname "*.zip" -not -path "./.git/*" | head -1)
            if [ -z "$Z" ]; then echo "ERROR: tidak ada package.json maupun file .zip di repo"; exit 1; fi
            echo "Ekstrak: $Z"
            mkdir -p _src && unzip -q -o "$Z" -d _src
            P=$(find _src -name package.json -not -path "*/node_modules/*" | head -1)
            if [ -z "$P" ]; then echo "ERROR: package.json tidak ada di dalam zip"; exit 1; fi
          fi
          D=$(dirname "$P"); echo "Project dir: $D"; echo "dir=$D" >> "$GITHUB_OUTPUT"
      - name: Install
        working-directory: ${{ steps.find.outputs.dir }}
        run: npm install --no-audit --no-fund
      - name: Build exe
        working-directory: ${{ steps.find.outputs.dir }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: RPG-Studio-exe
          path: ${{ steps.find.outputs.dir }}/dist/*.exe
